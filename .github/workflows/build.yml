name: Build

on:
  push:
    branches:
      - main
      - update1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore MediHiStat.sln

      - name: Build Release
        run: dotnet build MediHiStat.sln --configuration Release --no-restore
